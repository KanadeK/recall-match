[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "recall-match"
version = "0.1.0"
description = "Offline, explainable matching of owned-product inventories against CPSC recall data"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "KanadeK" }]
keywords = ["recall", "product-safety", "cpsc", "inventory", "offline"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Home Automation",
  "Topic :: Utilities",
]
dependencies = []

[project.optional-dependencies]
dev = [
  "build==1.5.0",
  "mypy==1.17.1",
  "pytest==8.4.1",
  "pytest-cov==6.2.1",
  "ruff==0.12.8",
]

[project.scripts]
recall-match = "recall_match.cli:main"

[project.urls]
Homepage = "https://github.com/KanadeK/recall-match"
Documentation = "https://github.com/KanadeK/recall-match#readme"
Issues = "https://github.com/KanadeK/recall-match/issues"
Source = "https://github.com/KanadeK/recall-match"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "--basetemp=.pytest-tmp"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["recall_match"]

[tool.mypy]
python_version = "3.10"
strict = true

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
